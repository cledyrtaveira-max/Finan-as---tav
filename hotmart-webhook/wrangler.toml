# deployed via GitHub Actions
name = "finanvo-webhook"
main = "worker.js"
compatibility_date = "2024-06-01"

# KV para rate limiting (crie com: wrangler kv namespace create "RATE_LIMIT_KV")
# Depois substitua o id abaixo pelo id retornado pelo comando acima.
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "SEU_KV_ID_AQUI"

# Secrets necessários (configure com wrangler secret put <nome>):
#   FIREBASE_PROJECT_ID   — ex: finanvo-4e9e0
#   FIREBASE_CLIENT_EMAIL — service account email
#   FIREBASE_PRIVATE_KEY  — service account private key (com \n)
#   HOTMART_HOTTOK        — hottok do webhook Hotmart
#   ADMIN_SECRET          — senha para o endpoint /set-admin (qualquer string segura)
# Tue Nov 10 20:48:42 -03 2026
# retrigger Tue Nov 10 21:01:47 -03 2026
# retrigger Tue Nov 10 23:45:22 -03 2026
# retrigger Wed Nov 11 00:58:09 -03 2026
# retrigger Wed Nov 11 01:06:10 -03 2026
# retrigger Wed Nov 11 01:11:53 -03 2026
