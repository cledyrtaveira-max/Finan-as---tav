name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'hotmart-webhook/**'
      - 'indicacoes-worker/**'

jobs:
  deploy-webhook:
    name: Deploy finanvo-webhook
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotmart-webhook
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: hotmart-webhook
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          HOTMART_HOTTOK: ${{ secrets.HOTMART_HOTTOK }}

  deploy-indicacoes:
    name: Deploy finanvo-indicacoes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: indicacoes-worker
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          ADMIN_SECRET: ${{ secrets.INDICACOES_ADMIN_SECRET }}
