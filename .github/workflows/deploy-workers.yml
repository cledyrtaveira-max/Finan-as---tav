name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'hotmart-webhook/**'
      - 'indicacoes-worker/**'

jobs:
  deploy-webhook:
    name: Deploy finanvo-webhook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy finanvo-webhook
        working-directory: hotmart-webhook
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-indicacoes:
    name: Deploy finanvo-indicacoes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy finanvo-indicacoes
        working-directory: indicacoes-worker
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
